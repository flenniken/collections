<!--$ # You build the image.html page from this template and -->
<!--$ # the collection's json file with the gulpfile image task. -->
<!--$ replace t.content = o.header -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,
initial-scale=1, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">
<!--$ endblock -->
<!--$ nextline -->
<!--$ : title = html(s.title, "body") -->
  <title>{title}</title>
  <link rel="stylesheet" href="/collections.css">
  <script src="/js/image.js"></script>
  <style>
body {
//$ # The page is hidden until it finishes loading so it does not flash.
  visibility: hidden;
  opacity: 0;
}
//$ # Selecting is turned off over the photo and the menu so pressing
//$ # them does not bring up the callout or the text loupe. The title and
//$ # description text stays selectable so you can copy it.
.bottom-menu {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#area {
  display: flex;
  overflow-x: scroll;
  scroll-snap-type: x mandatory;
}
.colbox {
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  min-width: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}
.container {
  position: relative;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.container img,
.container video.live-video {
  position: absolute;
  left: 0;
  top: 0;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
//$ # Holding an image for a second starts the iOS drag gesture, which
//$ # ends the page's touch and stops a playing Live Photo.
  -webkit-user-drag: none;
}
.container video.live-video {
  display: block;
  opacity: 0;
  pointer-events: none;
  object-fit: fill;
}
.container video.live-video.playing {
  opacity: 1;
}
.live-badge {
  display: none;
  position: absolute;
  top: max(10px, env(safe-area-inset-top, 0px));
  left: max(10px, env(safe-area-inset-left, 0px));
  z-index: 2;
  align-items: center;
  gap: 5px;
  padding: 4px 8px 4px 6px;
  border-radius: 6px;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  line-height: 1;
  pointer-events: none;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
  background: rgba(0, 0, 0, 0.28);
  opacity: 1;
  transition: opacity 0.18s ease;
}
.container.has-live .live-badge {
  display: flex;
}
.live-badge-icon {
  width: 18px;
  height: 18px;
  display: block;
  filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.45));
}
.container video.live-video.playing ~ .live-badge {
  opacity: 0;
}
  </style>
  <script>
//$ block
//$ : json = string(s, "json")
    var cJson = {json}
    var cJsonOriginal = {json}
//$ endblock
</script>
</head>
<body id="images">
  <div id="area">
<!--$ block -->
<!--$ : t.repeat = len(s.images) -->
<!--$ : image = s.images[t.row] -->
<!--$ : id = add(t.row, 1) -->
<!--$ : title = html(image.title, "body") -->
<!--$ : titleAttr = html(image.title, "attribute") -->
<!--$ : description = html(image.description, "body") -->
<!--$ : previewUrl = format("/images/c{s.cNum}/{image.iPreview}") -->
<!--$ : liveClass = if(exists(image, "iLiveVideo"), " has-live", "") -->
    <div class="colbox" id="cb{id}">
      <div class="container{liveClass}" id="c{id}">
        <img id="i{id}" src="{previewUrl}" alt="{titleAttr}" draggable="false">
        <video id="v{id}" class="live-video" playsinline webkit-playsinline muted preload="auto"></video>
        <div class="live-badge" aria-label="Live Photo">
          <svg class="live-badge-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
            <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span>LIVE</span>
        </div>
      </div>
      <h3 class="title">{title}</h3>
      <p class="description">{description}</p>
    </div>
<!--$ endblock -->
  </div>
  <div class="bottom-menu">
    <a href="/index.html">
      <img class="icon" src="/icons/index.svg" alt="index">
    </a>
<!--$ nextline -->
    <a href="thumbnails-{s.cNum}.html">
      <img class="icon" src="/icons/thumbnails.svg" alt="thumbnails">
    </a>
    <img class="icon right admin" src="/icons/download.svg"
      onclick="downloadCjson()" alt="download cjson">
    <img class="icon right" src="/icons/refresh.svg"
      onclick="window.location.reload()" alt="refresh">
  </div>
</body>
</html>
